name: Build

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Test and build
        run: ./gradlew :core:test :app:assembleDebug --stacktrace

      - name: Name the APK
        run: cp app/build/outputs/apk/debug/app-debug.apk newz.apk

      - uses: actions/upload-artifact@v4
        with:
          name: newz-apk
          path: newz.apk

      # One rolling release, replaced by each build, so the phone always
      # downloads from the same address.
      - name: Publish the APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest newz.apk \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "New-z build $GITHUB_RUN_NUMBER" \
            --notes "Built from \`$GITHUB_REF_NAME\` at $GITHUB_SHA. Install newz.apk; it updates over earlier builds."
